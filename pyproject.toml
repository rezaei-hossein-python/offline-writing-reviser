[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-writing-reviser"
version = "0.5.0b1"
description = "Offline-only Windows hotkey writing reviser backed by a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Offline Writing Reviser"}]
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6", "Pillow>=10"]

[project.scripts]
offline-writing-reviser = "offline_writing_reviser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_writing_reviser = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
